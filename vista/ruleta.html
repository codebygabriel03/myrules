<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ruleta Rusa - MyRules</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'title': ['Space Grotesk', 'sans-serif'],
                        'body': ['Inter', 'sans-serif'],
                        'mono': ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
    
    <style>
        .font-creepster { font-family: 'Creepster', cursive; }
        .font-special { font-family: 'Special Elite', monospace; }
        
        .revolver-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 auto;
            width: 100%;
        }
        
        .revolver {
            position: relative;
            width: min(300px, 80vw);
            height: min(280px, 75vw);
            margin: 10px auto;
        }
        
        .revolver-body {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            width: 38%;
            height: 20%;
            background: linear-gradient(180deg, #4a4a4a 0%, #2a2a2a 100%);
            border-radius: 12px 12px 6px 6px;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.5);
            z-index: 2;
        }
        
        .revolver-barrel {
            position: absolute;
            bottom: 28%;
            left: 50%;
            transform: translateX(-50%);
            width: 7%;
            height: 32%;
            background: linear-gradient(180deg, #555 0%, #333 100%);
            border-radius: 10px 10px 4px 4px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.5);
            z-index: 1;
        }
        
        .revolver-cylinder-wrapper {
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
        }
        
        .revolver-cylinder {
            position: relative;
            width: min(180px, 48vw);
            height: min(180px, 48vw);
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        .revolver-cylinder.spinning {
            animation: cylinderSpin 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        @keyframes cylinderSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(720deg); }
        }
        
        .cylinder-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 15%;
            height: 15%;
            background: radial-gradient(circle, #666 0%, #333 100%);
            border-radius: 50%;
            z-index: 2;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        
        .cylinder-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            height: 90%;
            border-radius: 50%;
            background: linear-gradient(135deg, #555 0%, #333 100%);
            box-shadow: 
                0 0 40px rgba(0,0,0,0.5),
                inset 0 4px 8px rgba(255,255,255,0.1);
        }
        
        .chamber-slot {
            position: absolute;
            width: 16%;
            height: 16%;
            border-radius: 50%;
            border: 3px solid #444;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.7);
        }
        
        .chamber-slot.active-slot {
            border-color: #fbbf24 !important;
            box-shadow: 0 0 25px rgba(251, 191, 36, 0.7), inset 0 4px 6px rgba(0,0,0,0.7);
            background: #111;
        }
        
        .chamber-slot .chamber-indicator {
            position: absolute;
            top: -30%;
            color: #fbbf24;
            font-size: clamp(12px, 3.5vw, 18px);
            animation: bounce 0.6s infinite alternate;
        }
        
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-6px); }
        }
        
        .chamber-slot .empty-chamber {
            width: 40%;
            height: 40%;
            border-radius: 50%;
            background: #2a2a2a;
            border: 2px solid #3a3a3a;
        }
        
        .revolver-hammer {
            position: absolute;
            top: -3%;
            left: 50%;
            transform: translateX(-50%);
            width: 8%;
            height: 12%;
            background: linear-gradient(180deg, #666 0%, #444 100%);
            border-radius: 8px 8px 0 0;
            z-index: 1;
            transition: transform 0.1s ease;
        }
        
        .revolver-hammer.pulled {
            transform: translateX(-50%) translateY(8px);
        }
        
        .counters-row {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        
        .mini-counter {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 5px 12px;
            border-radius: 20px;
        }
        
        .mini-counter .label {
            font-family: 'Special Elite', monospace;
            font-size: 10px;
            color: #9ca3af;
        }
        
        .mini-counter .value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 700;
        }
        
        .mini-counter .value.slots-color { color: #fbbf24; }
        .mini-counter .value.bullets-color { color: #ef4444; }
        
        .side-btn {
            font-family: 'Special Elite', monospace;
            transition: all 0.3s ease;
        }
        
        .slide-in { animation: slideIn 0.5s ease-out; }
        
        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .shake { animation: shake 0.3s ease-in-out; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-black text-white overflow-x-hidden font-body">
    
    <header class="border-b border-white/5 backdrop-blur-xl bg-gray-900/70 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-center h-12 lg:h-14">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 bg-gradient-to-br from-red-500 to-amber-500 rounded-xl flex items-center justify-center 
                                shadow-lg shadow-red-500/20">
                        <span class="font-mono font-bold text-sm text-white">M</span>
                    </div>
                    <span class="font-title font-bold text-base lg:text-lg tracking-tight text-white">
                        My <span class="text-red-400">Rules</span>
                    </span>
                </div>
            </div>
        </div>
    </header>

    <div class="container mx-auto px-2 sm:px-4 py-3 sm:py-6 max-w-5xl">
        
        <div id="mainMenu" class="max-w-2xl mx-auto">
            
            <header class="text-center mb-4 sm:mb-8">
                <h1 class="font-creepster text-3xl sm:text-5xl text-red-600 mb-1 sm:mb-3 slide-in">
                    <i class="fas fa-skull-crossbones"></i> Ruleta Rusa <i class="fas fa-skull-crossbones"></i>
                </h1>
                <p class="font-special text-gray-400 text-sm sm:text-lg">¿Tienes suerte hoy?</p>
            </header>
            
            <div class="bg-gray-800 rounded-2xl p-4 sm:p-8 shadow-2xl border border-gray-700">
                
                <div class="mb-6 sm:mb-8">
                    <h2 class="font-special text-lg sm:text-xl text-red-500 mb-3 sm:mb-4"><i class="fas fa-cogs mr-2"></i>Configuración del Arma</h2>
                    <div class="space-y-3 sm:space-y-4">
                        <div>
                            <label class="block font-special text-gray-300 mb-2 text-sm"><i class="fas fa-circle-notch mr-2"></i>Slots: <span id="slotsValue">6</span></label>
                            <input type="range" id="slots" min="2" max="12" value="6" class="w-full h-2 bg-gray-600 rounded-lg appearance-none cursor-pointer" oninput="updateSlotsValue()">
                        </div>
                        <div>
                            <label class="block font-special text-gray-300 mb-2 text-sm"><i class="fas fa-bullseye mr-2"></i>Balas: <span id="bulletsValue">1</span></label>
                            <input type="range" id="bullets" min="1" max="6" value="1" class="w-full h-2 bg-gray-600 rounded-lg appearance-none cursor-pointer" oninput="updateBulletsValue()">
                        </div>
                    </div>
                </div>

                <button onclick="startGame()" class="w-full bg-red-700 hover:bg-red-800 text-white font-special text-lg sm:text-xl py-3 sm:py-4 rounded-xl transition-all transform hover:scale-105">
                    <i class="fas fa-play-circle mr-2"></i>COMENZAR JUEGO
                </button>
            </div>
        </div>

        <div id="gameScreen" class="hidden max-w-lg mx-auto">
            
            <header class="text-center mb-2 sm:mb-4">
                <h1 class="font-creepster text-2xl sm:text-4xl text-red-600 mb-1 slide-in">
                    <i class="fas fa-skull-crossbones"></i> Ruleta Rusa <i class="fas fa-skull-crossbones"></i>
                </h1>
            </header>
            
            <div class="bg-gray-800 rounded-2xl p-3 sm:p-6 shadow-2xl border border-gray-700">
                <div class="flex justify-end items-start mb-2 sm:mb-4 gap-3">
                    <div class="relative">
                        <button onclick="toggleMenu()" class="text-gray-400 hover:text-white text-xl p-1 transition-colors">
                            <i class="fas fa-ellipsis-v"></i>
                        </button>
                        <div id="dropdownMenu" class="hidden absolute right-0 top-full mt-1 bg-gray-700 border border-gray-600 rounded-xl shadow-xl z-50 min-w-[160px]">
                            <button onclick="restartGame()" class="w-full text-left px-4 py-2.5 hover:bg-gray-600 text-sm text-gray-300 hover:text-white rounded-t-xl transition-colors flex items-center gap-2">
                                <i class="fas fa-redo-alt"></i> Reiniciar Juego
                            </button>
                            <button onclick="backToMenu()" class="w-full text-left px-4 py-2.5 hover:bg-gray-600 text-sm text-gray-300 hover:text-white rounded-b-xl transition-colors flex items-center gap-2">
                                <i class="fas fa-door-open"></i> Volver al Menú
                            </button>
                        </div>
                    </div>
                </div>

                <div id="gameContent" class="text-center">
                    <div class="counters-row mx-auto">
                        <div class="mini-counter">
                            <span class="label"><i class="fas fa-circle-notch mr-1"></i>Slots</span>
                            <span class="value slots-color"><span id="remainingSlots">6</span>/<span id="totalSlots">6</span></span>
                        </div>
                        <div class="mini-counter">
                            <span class="label"><i class="fas fa-bullseye mr-1"></i>Balas</span>
                            <span class="value bullets-color"><span id="remainingBullets">1</span>/<span id="totalBullets">1</span></span>
                        </div>
                    </div>
                    
                    <!-- ARMA CENTRADA -->
                    <div id="weaponDisplay" class="mb-4">
                        <div class="revolver-container">
                            <div class="revolver">
                                <div id="revolverHammer" class="revolver-hammer"></div>
                                
                                <div class="revolver-cylinder-wrapper">
                                    <div id="revolverCylinder" class="revolver-cylinder">
                                        <div class="cylinder-ring"></div>
                                        <div class="cylinder-center"></div>
                                        <div id="chambersContainer"></div>
                                    </div>
                                </div>
                                
                                <div class="revolver-barrel"></div>
                                <div class="revolver-body"></div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- BOTONES DEBAJO DEL ARMA -->
                    <div class="flex justify-center gap-3 sm:gap-4">
                        <button onclick="spinCylinder()" id="spinBtn" 
                                class="side-btn bg-yellow-600 hover:bg-yellow-700 text-white rounded-xl transition-all transform hover:scale-105
                                       px-5 sm:px-8 py-3 sm:py-4 text-sm sm:text-base
                                       flex items-center gap-2 shadow-lg shadow-yellow-600/20">
                            <i class="fas fa-sync-alt text-lg"></i>
                            <span>Girar</span>
                        </button>
                        
                        <button onclick="pullTrigger()" id="triggerBtn" 
                                class="side-btn bg-red-700 hover:bg-red-800 text-white rounded-xl transition-all transform hover:scale-105
                                       px-5 sm:px-8 py-3 sm:py-4 text-sm sm:text-base
                                       flex items-center gap-2 shadow-lg shadow-red-700/20">
                            <i class="fas fa-crosshairs text-lg"></i>
                            <span>Disparar</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal BANG -->
        <div id="gameOverModal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 p-4">
            <div class="bg-gray-800 rounded-2xl p-6 sm:p-8 shadow-2xl border border-gray-700 text-center max-w-sm w-full mx-4">
                <div class="text-5xl sm:text-6xl mb-4">
                    <i class="fas fa-skull-crossbones text-red-500"></i>
                </div>
                <h2 class="font-creepster text-3xl sm:text-4xl text-red-600 mb-4">¡BANG!</h2>
                <div class="space-y-3">
                    <button onclick="continueGame()" id="continueBtn" class="w-full bg-green-700 hover:bg-green-800 text-white font-special text-base sm:text-lg py-2.5 sm:py-3 rounded-xl transition-all">
                        <i class="fas fa-play-circle mr-2"></i>Continuar Juego
                    </button>
                    <button onclick="restartGameFromModal()" class="w-full bg-red-700 hover:bg-red-800 text-white font-special text-base sm:text-lg py-2.5 sm:py-3 rounded-xl transition-all">
                        <i class="fas fa-redo-alt mr-2"></i>Reiniciar Juego
                    </button>
                    <button onclick="backToMenuFromGameOver()" class="w-full bg-gray-600 hover:bg-gray-700 text-white font-special text-base sm:text-lg py-2.5 sm:py-3 rounded-xl transition-all">
                        <i class="fas fa-home mr-2"></i>Volver al Menú
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSpinSound() {
            initAudio();
            const now = audioCtx.currentTime;
            const duration = 0.4;
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            const filter1 = audioCtx.createBiquadFilter();
            osc1.type = 'sawtooth';
            osc1.frequency.setValueAtTime(60, now);
            osc1.frequency.linearRampToValueAtTime(300, now + duration);
            filter1.type = 'lowpass';
            filter1.frequency.setValueAtTime(300, now);
            filter1.frequency.linearRampToValueAtTime(1500, now + duration * 0.5);
            filter1.frequency.linearRampToValueAtTime(200, now + duration);
            filter1.Q.setValueAtTime(8, now);
            gain1.gain.setValueAtTime(0.25, now);
            gain1.gain.linearRampToValueAtTime(0.35, now + duration * 0.3);
            gain1.gain.linearRampToValueAtTime(0.15, now + duration);
            osc1.connect(filter1);
            filter1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + duration);
            for (let i = 0; i < 8; i++) {
                const t = now + i * (duration / 8);
                const clickOsc = audioCtx.createOscillator();
                const clickGain = audioCtx.createGain();
                const clickFilter = audioCtx.createBiquadFilter();
                clickOsc.type = 'square';
                clickOsc.frequency.setValueAtTime(600 + Math.random() * 800, t);
                clickFilter.type = 'highpass';
                clickFilter.frequency.setValueAtTime(1200, t);
                clickGain.gain.setValueAtTime(0.15, t);
                clickGain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
                clickOsc.connect(clickFilter);
                clickFilter.connect(clickGain);
                clickGain.connect(audioCtx.destination);
                clickOsc.start(t);
                clickOsc.stop(t + 0.05);
            }
        }

        function playEmptySound() {
            initAudio();
            const now = audioCtx.currentTime;
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            const filter1 = audioCtx.createBiquadFilter();
            osc1.type = 'triangle';
            osc1.frequency.setValueAtTime(500, now);
            osc1.frequency.exponentialRampToValueAtTime(80, now + 0.08);
            filter1.type = 'highpass';
            filter1.frequency.setValueAtTime(1800, now);
            gain1.gain.setValueAtTime(0.35, now);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            osc1.connect(filter1);
            filter1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.12);
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(200, now);
            osc2.frequency.exponentialRampToValueAtTime(40, now + 0.4);
            gain2.gain.setValueAtTime(0.15, now);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now);
            osc2.stop(now + 0.4);
        }

        function playBangSound() {
            initAudio();
            const now = audioCtx.currentTime;
            const bufferSize = audioCtx.sampleRate * 0.7;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                const t = i / audioCtx.sampleRate;
                data[i] = (Math.random() * 2 - 1) * Math.exp(-t * 10) * 2.0;
            }
            const noiseSource = audioCtx.createBufferSource();
            const noiseGain = audioCtx.createGain();
            const noiseFilter = audioCtx.createBiquadFilter();
            noiseSource.buffer = noiseBuffer;
            noiseFilter.type = 'lowpass';
            noiseFilter.frequency.setValueAtTime(8000, now);
            noiseFilter.frequency.exponentialRampToValueAtTime(400, now + 0.5);
            noiseGain.gain.setValueAtTime(1.5, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
            noiseSource.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noiseSource.start(now);
            noiseSource.stop(now + 0.7);
            const boomOsc = audioCtx.createOscillator();
            const boomGain = audioCtx.createGain();
            boomOsc.type = 'sine';
            boomOsc.frequency.setValueAtTime(50, now);
            boomOsc.frequency.exponentialRampToValueAtTime(6, now + 0.6);
            boomGain.gain.setValueAtTime(2.0, now);
            boomGain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
            boomOsc.connect(boomGain);
            boomGain.connect(audioCtx.destination);
            boomOsc.start(now);
            boomOsc.stop(now + 0.6);
            const subOsc = audioCtx.createOscillator();
            const subGain = audioCtx.createGain();
            subOsc.type = 'sine';
            subOsc.frequency.setValueAtTime(25, now);
            subOsc.frequency.exponentialRampToValueAtTime(3, now + 0.5);
            subGain.gain.setValueAtTime(1.5, now);
            subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            subOsc.connect(subGain);
            subGain.connect(audioCtx.destination);
            subOsc.start(now);
            subOsc.stop(now + 0.5);
            const crackOsc = audioCtx.createOscillator();
            const crackGain = audioCtx.createGain();
            const crackFilter = audioCtx.createBiquadFilter();
            crackOsc.type = 'sawtooth';
            crackOsc.frequency.setValueAtTime(4000, now);
            crackOsc.frequency.exponentialRampToValueAtTime(500, now + 0.1);
            crackFilter.type = 'highpass';
            crackFilter.frequency.setValueAtTime(2000, now);
            crackGain.gain.setValueAtTime(0.8, now);
            crackGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            crackOsc.connect(crackFilter);
            crackFilter.connect(crackGain);
            crackGain.connect(audioCtx.destination);
            crackOsc.start(now);
            crackOsc.stop(now + 0.15);
            const revBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 1.5, audioCtx.sampleRate);
            const revData = revBuffer.getChannelData(0);
            for (let i = 0; i < revBuffer.length; i++) {
                const t = i / audioCtx.sampleRate;
                revData[i] = (Math.random() * 2 - 1) * Math.exp(-t * 2) * 0.7 * (0.5 + 0.5 * Math.sin(2 * Math.PI * 4 * t));
            }
            const revSource = audioCtx.createBufferSource();
            const revGain = audioCtx.createGain();
            revSource.buffer = revBuffer;
            revGain.gain.setValueAtTime(0.6, now + 0.03);
            revGain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
            revSource.connect(revGain);
            revGain.connect(audioCtx.destination);
            revSource.start(now + 0.03);
            revSource.stop(now + 1.5);
        }

        function playHammerSound() {
            initAudio();
            const now = audioCtx.currentTime;
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            const filter1 = audioCtx.createBiquadFilter();
            osc1.type = 'triangle';
            osc1.frequency.setValueAtTime(450, now);
            osc1.frequency.exponentialRampToValueAtTime(120, now + 0.1);
            filter1.type = 'bandpass';
            filter1.frequency.setValueAtTime(600, now);
            filter1.Q.setValueAtTime(4, now);
            gain1.gain.setValueAtTime(0.5, now);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc1.connect(filter1);
            filter1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.15);
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(1000, now);
            osc2.frequency.exponentialRampToValueAtTime(200, now + 0.25);
            gain2.gain.setValueAtTime(0.3, now);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now);
            osc2.stop(now + 0.25);
        }

        // ========== GAME STATE ==========
        let gameState = {
            totalSlots: 6,
            totalBullets: 1,
            gun: null,
            gameActive: false,
            isSpinning: false
        };

        function toggleMenu() {
            document.getElementById('dropdownMenu').classList.toggle('hidden');
        }

        document.addEventListener('click', function(e) {
            const menu = document.getElementById('dropdownMenu');
            if (!menu.classList.contains('hidden') && !e.target.closest('#dropdownMenu') && !e.target.closest('button[onclick="toggleMenu()"]')) {
                menu.classList.add('hidden');
            }
        });

        function updateSlotsValue() {
            const v = document.getElementById('slots').value;
            document.getElementById('slotsValue').textContent = v;
            document.getElementById('bullets').max = v;
            if (parseInt(document.getElementById('bullets').value) > parseInt(v)) {
                document.getElementById('bullets').value = v;
                updateBulletsValue();
            }
        }

        function updateBulletsValue() {
            document.getElementById('bulletsValue').textContent = document.getElementById('bullets').value;
        }

        function startGame() {
            initAudio();
            const slots = parseInt(document.getElementById('slots').value);
            const bullets = parseInt(document.getElementById('bullets').value);
            if (bullets >= slots) return alert('El número de balas debe ser menor que el número de slots');
            
            gameState.totalSlots = slots;
            gameState.totalBullets = bullets;
            gameState.gameActive = true;
            gameState.isSpinning = false;
            gameState.gun = createGun();
            
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('totalSlots').textContent = gameState.totalSlots;
            document.getElementById('totalBullets').textContent = gameState.totalBullets;
            document.getElementById('remainingBullets').textContent = gameState.gun.bulletsInGun;
            renderGame();
        }

        function createGun() {
            const chambers = [];
            for (let i = 0; i < gameState.totalBullets; i++) chambers.push(true);
            for (let i = 0; i < gameState.totalSlots - gameState.totalBullets; i++) chambers.push(false);
            for (let i = chambers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [chambers[i], chambers[j]] = [chambers[j], chambers[i]];
            }
            return {
                chambers,
                currentPosition: 0,
                bulletsInGun: gameState.totalBullets,
                hasBeenSpun: false
            };
        }

        function renderCylinder() {
            const container = document.getElementById('chambersContainer');
            container.innerHTML = '';
            const gun = gameState.gun;
            const numChambers = gun.chambers.length;
            const cylinderEl = document.getElementById('revolverCylinder');
            const cylinderWidth = cylinderEl.offsetWidth;
            const radius = cylinderWidth * 0.35;
            const center = cylinderWidth / 2;
            
            gun.chambers.forEach((hasBullet, i) => {
                const angle = (i / numChambers) * 2 * Math.PI - Math.PI / 2;
                const slotSize = cylinderWidth * 0.16;
                const x = center + radius * Math.cos(angle) - slotSize / 2;
                const y = center + radius * Math.sin(angle) - slotSize / 2;
                
                const slot = document.createElement('div');
                slot.className = `chamber-slot${i === gun.currentPosition ? ' active-slot' : ''}`;
                slot.style.left = x + 'px';
                slot.style.top = y + 'px';
                slot.style.width = slotSize + 'px';
                slot.style.height = slotSize + 'px';
                
                if (i === gun.currentPosition) {
                    slot.innerHTML = '<div class="chamber-indicator"><i class="fas fa-caret-down"></i></div>';
                }
                
                slot.innerHTML += '<div class="empty-chamber"></div>';
                
                container.appendChild(slot);
            });
        }

        function renderGame() {
            const gun = gameState.gun;
            document.getElementById('remainingSlots').textContent = gun.chambers.length;
            document.getElementById('remainingBullets').textContent = gun.bulletsInGun;
            renderCylinder();
        }

        function spinCylinder() {
            if (!gameState.gameActive || gameState.isSpinning) return;
            gameState.isSpinning = true;
            const gun = gameState.gun;
            
            for (let i = gun.chambers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [gun.chambers[i], gun.chambers[j]] = [gun.chambers[j], gun.chambers[i]];
            }
            gun.currentPosition = 0;
            gun.hasBeenSpun = true;
            
            playSpinSound();
            
            const cylinder = document.getElementById('revolverCylinder');
            cylinder.classList.add('spinning');
            
            setTimeout(() => {
                cylinder.classList.remove('spinning');
                gameState.isSpinning = false;
                renderGame();
            }, 400);
        }

        function pullTrigger() {
            if (!gameState.gameActive || gameState.isSpinning) return;
            const gun = gameState.gun;
            
            if (!gun.chambers.length) {
                gameState.gameActive = false;
                showGameOver(false);
                return;
            }
            
            const hammer = document.getElementById('revolverHammer');
            hammer.classList.add('pulled');
            
            playHammerSound();
            
            const bullet = gun.chambers[gun.currentPosition];
            
            if (bullet) {
                setTimeout(() => playBangSound(), 120);
                
                const revolver = document.querySelector('.revolver');
                revolver.classList.add('shake');
                
                setTimeout(() => {
                    hammer.classList.remove('pulled');
                    revolver.classList.remove('shake');
                }, 300);
                
                gun.bulletsInGun--;
                gun.chambers.splice(gun.currentPosition, 1);
                if (gun.currentPosition >= gun.chambers.length) gun.currentPosition = 0;
                
                renderGame();
                
                const canContinue = gun.bulletsInGun > 0;
                gameState.gameActive = false;
                
                setTimeout(() => showGameOver(canContinue), 400);
            } else {
                setTimeout(() => playEmptySound(), 100);
                
                setTimeout(() => {
                    hammer.classList.remove('pulled');
                }, 200);
                
                gun.chambers.splice(gun.currentPosition, 1);
                if (gun.currentPosition >= gun.chambers.length) gun.currentPosition = 0;
                
                renderGame();
                
                if (!gun.chambers.length) {
                    gameState.gun = createGun();
                    document.getElementById('totalBullets').textContent = gameState.totalBullets;
                    setTimeout(() => {
                        alert('¡Todos los slots agotados! Se recarga una nueva arma.');
                        renderGame();
                    }, 300);
                }
            }
        }

        function showGameOver(canContinue) {
            const continueBtn = document.getElementById('continueBtn');
            continueBtn.style.display = canContinue ? 'block' : 'none';
            document.getElementById('gameOverModal').classList.remove('hidden');
        }

        function continueGame() {
            document.getElementById('gameOverModal').classList.add('hidden');
            gameState.gameActive = true;
            renderGame();
        }

        function restartGameFromModal() {
            document.getElementById('gameOverModal').classList.add('hidden');
            restartGame();
        }

        function restartGame() {
            gameState.isSpinning = false;
            gameState.gun = createGun();
            gameState.gameActive = true;
            document.getElementById('totalSlots').textContent = gameState.totalSlots;
            document.getElementById('totalBullets').textContent = gameState.totalBullets;
            document.getElementById('dropdownMenu').classList.add('hidden');
            renderGame();
        }

        function backToMenu() {
            if (confirm('¿Estás seguro de volver al menú? El juego actual se perderá.')) {
                gameState.gameActive = false;
                document.getElementById('gameScreen').classList.add('hidden');
                document.getElementById('mainMenu').classList.remove('hidden');
                document.getElementById('dropdownMenu').classList.add('hidden');
            }
        }

        function backToMenuFromGameOver() {
            document.getElementById('gameOverModal').classList.add('hidden');
            backToMenu();
        }

        window.addEventListener('resize', () => {
            if (gameState.gameActive) renderCylinder();
        });

        updateSlotsValue();
        updateBulletsValue();

        document.getElementById('slots').addEventListener('input', function() {
            document.getElementById('bullets').max = this.value;
            if (parseInt(document.getElementById('bullets').value) >= parseInt(this.value)) {
                document.getElementById('bullets').value = this.value - 1;
                updateBulletsValue();
            }
            updateSlotsValue();
        });
        
        document.getElementById('bullets').addEventListener('input', function() {
            if (parseInt(this.value) >= parseInt(document.getElementById('slots').value)) {
                this.value = document.getElementById('slots').value - 1;
            }
            updateBulletsValue();
        });
    </script>
</body>
</html>
